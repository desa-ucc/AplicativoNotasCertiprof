<div class="p-8 max-w-6xl mx-auto">
  <h1 class="text-3xl font-bold mb-6 text-gray-800">Historial de Cargas</h1>

  <div class="overflow-x-auto shadow ring-1 ring-black ring-opacity-5 md:rounded-lg">
    <table class="min-w-full divide-y divide-gray-300">
      <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6">ID</th>
          <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Fecha de Carga</th>
          <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Usuario</th>
          <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Código Curso</th>
          <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Registros</th>
          <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6">
            <span class="sr-only">Descargar</span>
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 bg-white">
        <tr *ngFor="let history of histories">
          <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">{{ history.id }}</td>
          <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">{{ history.uploadDate | date:'medium' }}</td>
          <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">{{ history.uploadedBy }}</td>
          <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500 font-bold">{{ history.courseCode }}</td>
          <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">{{ history.processedRecordsCount }}</td>
          <td class="relative whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-6">
            <button (click)="downloadActa(history.id, history.courseCode)" class="text-blue-600 hover:text-blue-900 font-medium">Descargar Acta</button>
          </td>
        </tr>
        <tr *ngIf="histories.length === 0">
          <td colspan="6" class="px-3 py-4 text-sm text-gray-500 text-center">No hay registros de historial.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
