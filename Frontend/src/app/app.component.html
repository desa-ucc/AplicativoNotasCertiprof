<div *ngIf="loggedIn">
  <!-- TopNavBar -->
  <header class="fixed top-0 right-0 h-16 flex items-center justify-between px-md z-30 bg-surface/95 backdrop-blur-md border-b border-outline-variant/30 shadow-sm dark:shadow-none docked w-[calc(100%-280px)] hidden md:flex">
  <div class="flex items-center">
  <!-- Empty for alignment -->
  </div>
  <div class="flex items-center gap-md">
  <div class="relative">
  <input class="pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-md font-body-md text-on-surface focus:outline-none focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all" placeholder="Search..." type="text">
  <span class="material-symbols-outlined absolute left-3 top-2.5 text-on-surface-variant">search</span>
  </div>
  <button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors scale-95 duration-75">
  <span class="material-symbols-outlined">notifications</span>
  </button>
  <button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors scale-95 duration-75">
  <span class="material-symbols-outlined">settings</span>
  </button>
  <button (click)="logout()" class="w-10 h-10 flex items-center justify-center rounded-full text-error hover:bg-error-container transition-colors scale-95 duration-75" title="Cerrar Sesión">
  <span class="material-symbols-outlined">logout</span>
  </button>
  </div>
  </header>

  <!-- SideNavBar -->
  <nav class="fixed left-0 top-0 h-full w-[280px] z-40 flex flex-col bg-gradient-to-b from-[#003D4C] to-[#002a34] text-white border-r border-white/10 shadow-2xl hidden md:flex">
    <div class="px-6 pt-10 pb-4 mb-6">
      <div class="flex items-center gap-2 mb-1">
        <span class="w-8 h-8 rounded-lg bg-[#76bc21] flex items-center justify-center text-[#003D4C]">
          <span class="material-symbols-outlined text-[20px] font-bold">water_drop</span>
        </span>
        <h1 class="text-xl font-bold tracking-tight text-white">Aplicativo notas <span class="text-[#76bc21]">Certiprof</span></h1>
      </div>
      <p class="text-[10px] uppercase tracking-[0.25em] font-medium text-white/40 ml-10">Petroleum Systems</p>
    </div>

    <ul class="flex-1 flex flex-col gap-1 px-4 m-0 list-none">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.path"
           routerLinkActive="bg-[rgba(118,188,33,0.1)] border-l-4 border-[#76bc21] text-white structural-active"
           [routerLinkActiveOptions]="{exact: true}"
           class="group flex items-center gap-3 px-4 py-3.5 rounded-xl text-white/60 hover:text-white hover:bg-white/5 transition-all duration-300">
          <span class="material-symbols-outlined text-[22px] group-[.structural-active]:text-[#76bc21] group-[.structural-active]:[font-variation-settings:'FILL'_1]">{{ item.icon }}</span>
          <span class="font-medium text-[14px] group-[.structural-active]:font-semibold">{{ item.name }}</span>
        </a>
      </li>
    </ul>

    <div class="p-4 mt-auto mb-6">
      <div class="flex items-center gap-3 p-3 rounded-2xl bg-white/5 border border-white/10 group cursor-pointer hover:bg-white/10 transition-all">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-[rgba(118,188,33,0.2)] flex items-center justify-center text-[#76bc21] overflow-hidden border border-[rgba(118,188,33,0.2)]">
            <span class="material-symbols-outlined text-[22px] font-medium">person</span>
          </div>
          <div class="absolute bottom-0 right-0 w-3 h-3 bg-[#76bc21] border-2 border-[#002a34] rounded-full"></div>
        </div>
        <div class="flex flex-col min-w-0">
          <p class="text-[13px] font-bold text-white truncate">Admin User</p>
          <p class="text-[10px] text-white/40 font-medium uppercase tracking-wider truncate">{{userRole}}</p>
        </div>
        <button class="ml-auto text-white/30 group-hover:text-white/60 transition-colors">
          <span class="material-symbols-outlined text-[18px]">more_vert</span>
        </button>
      </div>
    </div>
  </nav>
</div>

<!-- Main Content Area -->
<div [ngClass]="{'md:ml-sidebar-width pt-20 px-lg pb-xl': loggedIn}">
  <router-outlet></router-outlet>
</div>
