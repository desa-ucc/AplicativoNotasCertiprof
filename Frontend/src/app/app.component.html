<div class="min-h-screen bg-gray-50 text-gray-900 font-sans antialiased">
  <!-- Navigation Header -->
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex">
          <div class="flex-shrink-0 flex items-center gap-2">
            <!-- Modern Logo Icon -->
            <svg class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            <span class="font-bold text-xl text-gray-900 tracking-tight">AVATAR Admin</span>
          </div>
          <div class="hidden sm:-my-px sm:ml-8 sm:flex sm:space-x-8" *ngIf="isLoggedIn()">
            <a *ngFor="let item of userMenu"
               [routerLink]="item.path"
               routerLinkActive="border-indigo-500 text-indigo-600"
               [routerLinkActiveOptions]="{exact: true}"
               class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors duration-200">
               <i *ngIf="item.icon" class="pi {{item.icon}} mr-2"></i>
              {{ item.name }}
            </a>
          </div>
        </div>
        <div class="hidden sm:ml-6 sm:flex sm:items-center gap-4" *ngIf="isLoggedIn()">
          <div class="flex items-center gap-2 bg-gray-100 px-3 py-1.5 rounded-full border border-gray-200">
            <span class="h-2 w-2 rounded-full bg-green-500"></span>
            <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">{{ userRole }}</span>
          </div>
          <button (click)="logout()" class="inline-flex items-center justify-center p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors duration-200 focus:outline-none" title="Cerrar Sesión">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <div class="py-10">
    <main>
      <div class="max-w-7xl mx-auto sm:px-6 lg:px-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
