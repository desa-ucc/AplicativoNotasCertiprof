<div *ngIf="loggedIn">
  <!-- TopNavBar -->
  <header class="fixed top-0 right-0 h-16 flex items-center justify-between px-md z-30 bg-surface/95 backdrop-blur-md border-b border-outline-variant/30 shadow-sm dark:shadow-none docked w-[calc(100%-280px)] hidden md:flex">
  <div class="flex items-center">
  <!-- Empty for alignment -->
  </div>
  <div class="flex items-center gap-md">
  <div class="relative">
  <input class="pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-md font-body-md text-on-surface focus:outline-none focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all" placeholder="Search..." type="text">
  <span class="material-symbols-outlined absolute left-3 top-2.5 text-on-surface-variant">search</span>
  </div>
  <button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors scale-95 duration-75">
  <span class="material-symbols-outlined">notifications</span>
  </button>
  <button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors scale-95 duration-75">
  <span class="material-symbols-outlined">settings</span>
  </button>
  <button (click)="logout()" class="w-10 h-10 flex items-center justify-center rounded-full text-error hover:bg-error-container transition-colors scale-95 duration-75" title="Cerrar Sesión">
  <span class="material-symbols-outlined">logout</span>
  </button>
  </div>
  </header>

  <!-- SideNavBar -->
  <nav class="fixed left-0 top-0 h-full w-sidebar-width z-40 flex flex-col bg-on-secondary-fixed-variant dark:bg-on-secondary-fixed docked flat no shadows hidden md:flex">
  <div class="p-lg border-b border-surface/10">
  <h1 class="text-headline-md font-headline-md font-bold text-surface-container-lowest">AVATAR Admin</h1>
  <p class="text-label-md font-label-md text-secondary-fixed mt-xs">Management Suite ({{userRole}})</p>
  </div>
  <ul class="flex-1 py-md flex flex-col gap-xs px-sm m-0 list-none">
  <li *ngFor="let item of menuItems">
  <a [routerLink]="item.path"
     routerLinkActive="border-l-4 border-primary-container text-surface-container-lowest bg-on-secondary-fixed/50"
     [routerLinkActiveOptions]="{exact: true}"
     class="flex items-center gap-base px-md py-sm text-outline-variant hover:text-surface-container-lowest transition-all duration-200 ease-in-out hover:bg-on-secondary-fixed-variant/80">
  <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">{{ item.icon }}</span>
  <span class="font-body-md text-body-md">{{ item.name }}</span>
  </a>
  </li>
  </ul>
  <div class="p-md border-t border-surface/10 flex items-center gap-sm">
  <div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden flex items-center justify-center">
  <span class="material-symbols-outlined text-on-surface-variant">person</span>
  </div>
  <div>
  <p class="font-label-md text-label-md text-surface-container-lowest">Perfil Usuario</p>
  </div>
  </div>
  </nav>
</div>

<!-- Main Content Area -->
<div [ngClass]="{'md:ml-sidebar-width pt-20 px-lg pb-xl': loggedIn}">
  <router-outlet></router-outlet>
</div>
