<div class="p-8 max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold mb-6 text-gray-800">Procesar Reporte de Certiprof</h1>

  <div
    class="border-4 border-dashed rounded-lg p-12 text-center transition-colors duration-200"
    [ngClass]="{'border-blue-500 bg-blue-50': isDragging, 'border-gray-300 hover:border-gray-400': !isDragging}"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <div class="mb-4">
      <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div class="flex text-sm text-gray-600 justify-center">
      <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
        <span>Sube un archivo</span>
        <input id="file-upload" name="file-upload" type="file" class="sr-only" accept=".csv,.xlsx" (change)="onFileSelected($event)">
      </label>
      <p class="pl-1">o arrastra y suelta aquí</p>
    </div>
    <p class="text-xs text-gray-500 mt-2">CSV o Excel (.csv o .xlsx)</p>
  </div>

  <div *ngIf="selectedFile" class="mt-8 space-y-4">
    <div class="flex items-center justify-between bg-gray-50 p-4 rounded-lg border border-gray-200">
      <div>
        <p class="text-sm font-medium text-gray-900">Archivo seleccionado:</p>
        <p class="text-sm text-gray-500">{{ selectedFile.name }}</p>
      </div>
      <div class="flex gap-2">
        <button
          (click)="processFile()"
          [disabled]="isProcessing"
          class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-blue-300"
        >
          <span *ngIf="isProcessing">Procesando...</span>
          <span *ngIf="!isProcessing">Carga de Datos</span>
        </button>
      </div>
    </div>

    <div *ngIf="successMessage" class="rounded-md bg-green-50 p-4 mt-4">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
          </svg>
        </div>
        <div class="ml-3">
          <h3 class="text-sm font-medium text-green-800">{{ successMessage }}</h3>
        </div>
      </div>
    </div>
  </div>
</div>
